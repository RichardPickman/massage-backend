name: CI

on:
  push:
    # master is production and testing is the integration branch. An image only
    # ever comes from a push to one of these, never from a pull request.
    branches: [master, testing]
  pull_request:
  # Lets the image be built from a throwaway branch, so the registry path can
  # be exercised before it is trusted with a deploy.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm api:build

  # The artefact a deploy pulls. Every tag names a commit, so the TAG in a
  # stack's .env states exactly which code is running and a rollback is writing
  # an older one.
  publish:
    name: publish
    needs: gate
    # A pull request must never move a tag that a running stack resolves.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - id: meta
        name: Work out the tags
        run: |
          short="$(git rev-parse --short=7 HEAD)"
          tags="ghcr.io/richardpickman/massage-backend:sha-${short}"
          # Only the integration branch carries a moving tag.
          # Production is promoted by digest, so no push can drag it.
          if [ "${GITHUB_REF_NAME}" = "testing" ]; then
            tags="${tags}"$'\n'"ghcr.io/richardpickman/massage-backend:testing"
          fi
          {
            echo "tags<<EOF"
            echo "${tags}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
